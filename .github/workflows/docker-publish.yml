# Builds the frontend image and publishes it to Docker Hub:
#   docker pull adcbueno1/virtual-science-park:latest
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME = adcbueno1
#   DOCKERHUB_TOKEN    = a Docker Hub access token (hub.docker.com → Account settings → Personal access tokens, Read & Write)
#
# Tags:  push to master/main → latest + sha-<commit>
#        git tag v1.0.0       → 1.0.0, 1.0, latest
#        manual run           → the version you type (e.g. 1.0.0)
name: Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

env:
  IMAGE: adcbueno1/virtual-science-park

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Virtual Science Park
            org.opencontainers.image.description=Blue Science Park Virtual Science Park — frontend (TanStack Start, Node server)

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
